<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Prototipo web de VISTA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00695c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VISTA">
  <title>VISTA</title>
</head>
<body>
  <div id="boot-status" role="status" aria-live="polite">
    Iniciando VISTA…
  </div>
  <style>
    #boot-status {
      box-sizing: border-box;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      color: #174f49;
      background: #f5f7f6;
      font: 600 18px system-ui, sans-serif;
      text-align: center;
    }
  </style>
  <script>
    (() => {
      const status = document.getElementById('boot-status');
      let firstFrame = false;

      const showError = (message) => {
        status.textContent = message;
        status.style.color = '#8b1e1e';
      };

      window.addEventListener('flutter-first-frame', () => {
        firstFrame = true;
        status.remove();
      }, { once: true });

      window.addEventListener('error', (event) => {
        showError(`No se pudo iniciar VISTA: ${event.message || 'error de JavaScript'}`);
      });

      window.addEventListener('unhandledrejection', (event) => {
        showError(`No se pudo iniciar VISTA: ${String(event.reason)}`);
      });

      window.setTimeout(() => {
        if (!firstFrame) {
          showError('VISTA no terminó de cargar. Reinicia flutter run y recarga esta página.');
        }
      }, 15000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
