name: app_vista
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.2
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  # API SQLite comun (Dart puro): la usan los repositorios y el servidor de la
  # semana 14, que corre con "dart run" sin motor Flutter.
  sqflite_common: ^2.5.4
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  # API HTTP de la semana 14 (servicio y enrutador).
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  image: ^4.5.4
  permission_handler: ^12.0.1
  ultralytics_yolo: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Cliente HTTP para las pruebas de API y la medicion de RFN-08.
  http: ^1.2.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - db/schema.sql
    - assets/models/